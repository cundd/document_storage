services:
  # general settings
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Cundd\DocumentStorage\:
    resource: "../Classes/*"
    exclude: ["../Classes/Domain/ValueObject/*", "../Classes/Domain/Model/*"]

  Cundd\DocumentStorage\Domain\Repository\DocumentRepositoryFactory:
    public: true

  Cundd\DocumentStorage\Persistence\Repository\CoreDocumentRepository:
    autowire: false

  Cundd\DocumentStorage\Command\GeneralCommand:
    tags:
      - name: "console.command"
        command: "document-storage"
        description: "Create a new Document"

  Cundd\DocumentStorage\Command\Database\ListCommand:
    tags:
      - name: "console.command"
        command: "document-storage:database:list"
        aliases: ["document-storage:list"]
        description: "List all databases"

  Cundd\DocumentStorage\Command\Document\CreateCommand:
    tags:
      - name: "console.command"
        command: "document-storage:document:create"
        aliases: ["create"]
        description: "Create a new Document"

  Cundd\DocumentStorage\Command\Document\ReadCommand:
    tags:
      - name: "console.command"
        command: "document-storage:document:read"
        aliases: ["document-storage:read"]
        description: "Read Documents from the database"

  Cundd\DocumentStorage\Command\Document\DeleteCommand:
    tags:
      - name: "console.command"
        command: "document-storage:document:delete"
        aliases: ["document-storage:delete"]
        description: "Remove a Document from the database"

  Cundd\DocumentStorage\Command\Document\GcCommand:
    tags:
      - name: "console.command"
        command: "document-storage:document:gc"
        aliases: ["document-storage:gc"]
        description: "Permanently remove deleted Documents"
